<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ISL Translator Web</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div class="h-screen p-4 flex flex-col">
    
    <div class="flex justify-center space-x-4 mb-4">
      <button id="startBtn" class="px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg shadow-lg transition-colors duration-200">
        Start Translation
      </button>
      <button id="stopBtn" disabled class="px-8 py-3 bg-gray-600 text-gray-300 font-bold rounded-lg shadow-lg transition-colors duration-200 cursor-not-allowed">
        Stop Translation
      </button>
    </div>

    <div class="flex-1 grid grid-cols-1 md:grid-cols-10 gap-4 min-h-0">
      <section class="md:col-span-6 bg-slate-900 rounded-2xl shadow-xl overflow-hidden relative">
        <div id="subtitleBanner" class="absolute top-0 left-0 right-0 z-10 bg-black/60 text-white px-4 py-3 text-sm md:text-base text-center transition-all">
          Click "Start Translation" to begin
        </div>
        <video id="webcam" autoplay playsinline class="w-full h-full object-cover bg-black [transform:scaleX(-1)]"></video>
        <canvas id="captureCanvas" class="hidden"></canvas>
      </section>

      <section class="md:col-span-4 bg-slate-900 rounded-2xl shadow-xl p-4 flex flex-col min-h-0">
        <h2 class="text-lg font-semibold mb-3">Chat Log</h2>
        <div id="chatLog" class="flex-1 overflow-y-auto space-y-2 pr-1"></div>
      </section>
    </div>
  </div>

  <script>
    const videoEl = document.getElementById("webcam");
    const canvasEl = document.getElementById("captureCanvas");
    const subtitleBanner = document.getElementById("subtitleBanner");
    const chatLog = document.getElementById("chatLog");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");

    const canvasCtx = canvasEl.getContext("2d");
    let ws = null;
    let isTranslating = false; // Flag to control auto-reconnect

    function appendLog(word) {
      const row = document.createElement("div");
      row.className = "bg-slate-800 rounded-lg px-3 py-2 text-sm text-green-400 font-medium";
      row.textContent = `Predicted: ${word}`;
      chatLog.appendChild(row);
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    function speakWord(word) {
      const utterance = new SpeechSynthesisUtterance(word);
      window.speechSynthesis.speak(utterance);
    }

    function sendFrame() {
      if (!isTranslating || !ws || ws.readyState !== WebSocket.OPEN) return;
      if (videoEl.readyState < 2) return;

      const width = videoEl.videoWidth;
      const height = videoEl.videoHeight;
      if (!width || !height) return;

      if (canvasEl.width !== width || canvasEl.height !== height) {
        canvasEl.width = width;
        canvasEl.height = height;
      }
      canvasCtx.drawImage(videoEl, 0, 0, width, height);

      const frameDataUrl = canvasEl.toDataURL("image/jpeg", 0.7);
      ws.send(frameDataUrl);
    }

    function connectWebSocket() {
      const protocol = window.location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${protocol}://${window.location.host}/ws`);

      ws.onopen = () => {
        sendFrame();
      };

      ws.onmessage = (event) => {
        if (!isTranslating) return; 
        
        try {
          const data = JSON.parse(event.data);
          
          if (data.type === "word") {
            // Just update the visual banner instantly so the user knows it's working
            subtitleBanner.textContent = data.text;
            
          } else if (data.type === "sentence") {
            // When the 2-second pause triggers, speak and log the fluent sentence
            speakWord(data.text);
            subtitleBanner.textContent = data.text;
            appendLog(data.text);
          }
          
        } catch (err) {
          console.error("Invalid WebSocket payload", err);
        }
        sendFrame(); 
      };
      
      ws.onclose = () => {
        // Only try to reconnect if we are SUPPOSED to be translating
        if (isTranslating) {
          setTimeout(connectWebSocket, 1200);
        }
      };
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 640, height: 480 },
          audio: false,
        });
        videoEl.srcObject = stream;
        await new Promise((resolve) => {
          if (videoEl.readyState >= 1) {
            resolve();
            return;
          }
          videoEl.onloadedmetadata = () => resolve();
        });
        subtitleBanner.textContent = "Waiting for signs...";
      } catch (err) {
        subtitleBanner.textContent = "Camera access denied or unavailable.";
        console.error("Camera error:", err);
        isTranslating = false; // Reset if camera fails
      }
    }

    function stopCameraAndSocket() {
      // 1. Set flag to false so WebSocket doesn't auto-reconnect
      isTranslating = false;

      // 2. Close WebSocket
      if (ws) {
        ws.close();
        ws = null;
      }

      // 3. Kill the webcam feed
      if (videoEl.srcObject) {
        videoEl.srcObject.getTracks().forEach(track => track.stop());
        videoEl.srcObject = null;
      }

      subtitleBanner.textContent = "Translation stopped. Click Start to resume.";
    }

    // --- BUTTON EVENT LISTENERS ---

    startBtn.addEventListener('click', async () => {
      isTranslating = true;

      // Update Start Button UI
      startBtn.innerText = "Translating...";
      startBtn.classList.remove("bg-blue-600", "hover:bg-blue-700");
      startBtn.classList.add("bg-green-600", "cursor-not-allowed");
      startBtn.disabled = true;

      // Update Stop Button UI
      stopBtn.disabled = false;
      stopBtn.classList.remove("bg-gray-600", "cursor-not-allowed");
      stopBtn.classList.add("bg-red-600", "hover:bg-red-700");
      
      subtitleBanner.textContent = "Connecting camera...";

      await startCamera();
      if (isTranslating) { // Check again in case user hit stop really fast
        connectWebSocket();
      }
    });

    stopBtn.addEventListener('click', () => {
      stopCameraAndSocket();

      // Reset Start Button UI
      startBtn.disabled = false;
      startBtn.innerText = "Start Translation";
      startBtn.classList.remove("bg-green-600", "cursor-not-allowed");
      startBtn.classList.add("bg-blue-600", "hover:bg-blue-700");

      // Reset Stop Button UI
      stopBtn.disabled = true;
      stopBtn.classList.remove("bg-red-600", "hover:bg-red-700");
      stopBtn.classList.add("bg-gray-600", "cursor-not-allowed");
    });

  </script>
</body>
</html>
